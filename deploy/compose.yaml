services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: shop-nginx:1.0
    container_name: shop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - prestashop

  prestashop:
    image: prestashop/prestashop:8.2.8
    container_name: shop-prestashop
    restart: unless-stopped
    expose:
      - "80"
    environment:
      DB_SERVER: mariadb
      DB_NAME: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USER}
      DB_PASSWD: ${DATABASE_PASSWORD}
      PS_INSTALL_AUTO: 1
      PS_DEV_MODE: 0
      PS_LANGUAGE: pl
      PS_COUNTRY: PL
      PS_DOMAIN: localhost
      PS_SSL_DOMAIN: localhost
      PS_ENABLE_SSL: 1
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWORD}
      PS_FOLDER_ADMIN: admin-dev
    volumes:
      - prestashop_data:/var/www/html
      - ../shop/modules/domitekcookies:/var/www/html/modules/domitekcookies
      - ../shop/modules/omnibus:/var/www/html/modules/omnibus
      - ../shop/themes/topmarket-child:/var/www/html/themes/topmarket-child
      - ../shop/override/classes/Search.php:/var/www/html/override/classes/Search.php:ro
      - ./search-index.php:/tmp/search-index.php:ro
    # The generated PHP class index belongs to the container and its mounted overrides.
    tmpfs:
      - /var/www/html/var/cache:uid=33,gid=33,mode=0755
    depends_on:
      - mariadb
      - mailpit

  mariadb:
    image: mariadb:10.11
    container_name: shop-mariadb
    restart: unless-stopped
    ports:
      - "3000:3306"
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: shop-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # Port SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  prestashop_data:
  db_data:
